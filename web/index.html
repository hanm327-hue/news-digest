<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴스 다이제스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 팔레트: 붙여 주신 design.md의 TDS 발행값 기준 */
  :root {
    --blue-500: #3182F6; --blue-50: #E8F3FF;
    --grey-900: #191F28; --grey-800: #333D4B; --grey-700: #4E5968; --grey-600: #6B7684;
    --grey-500: #8B95A1; --grey-400: #B0B8C1; --grey-200: #E5E8EB; --grey-100: #F2F4F6; --grey-50: #F9FAFB;
    --surface: #FFFFFF; --bg: var(--grey-100);
    --press: rgba(0, 0, 0, .06);
    --shadow-1: 0 1px 2px rgba(2, 9, 30, .04), 0 1px 1px rgba(2, 9, 30, .04);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --blue-500: #3485FA; --blue-50: #202C4D;
      --grey-900: #FFFFFF; --grey-800: #E4E4E5; --grey-700: #C3C3C6; --grey-600: #9E9EA4;
      --grey-500: #7E7E87; --grey-400: #62626D; --grey-200: #3C3C47; --grey-100: #2C2C35; --grey-50: #202027;
      --surface: #202027; --bg: #17171C;
      --press: rgba(255, 255, 255, .06);
      --shadow-1: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--grey-900);
    font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .page { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

  /* 상단바 */
  .top { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 0 0 4px; }
  .top-bar { height: 56px; display: flex; align-items: center; }
  .top-bar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; }

  /* 날짜 칩 */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--grey-200); background: var(--surface); color: var(--grey-700);
    font: 600 13px/1 var(--font); cursor: pointer; font-variant-numeric: tabular-nums;
    transition: background-color 200ms var(--ease), color 200ms var(--ease);
  }
  .chip[aria-pressed="true"] { background: var(--grey-900); border-color: var(--grey-900); color: var(--surface); }

  /* 헤더 문구 */
  .intro { padding: 12px 4px 20px; }
  .intro .date { margin: 0 0 4px; color: var(--grey-600); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .intro h2 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
  .intro h2 em { font-style: normal; color: var(--blue-500); }

  /* 카드 공통 */
  .card {
    background: var(--surface); border-radius: 20px; padding: 24px;
    box-shadow: var(--shadow-1); margin-bottom: 12px;
  }

  /* 세 줄 요약 카드 */
  .summary .label {
    display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px;
    background: var(--blue-50); color: var(--blue-500); font-size: 12px; font-weight: 600; margin-bottom: 14px;
  }
  .summary ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .summary li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 17px; line-height: 1.5; color: var(--grey-800); }
  .summary li .n {
    width: 24px; height: 24px; border-radius: 999px; background: var(--grey-100); color: var(--grey-600);
    display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums;
  }

  /* 섹션 헤더 */
  .list-header { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 4px 12px; }
  .list-header h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; }
  .list-header span { color: var(--grey-500); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 기사 카드 */
  .article { display: flex; flex-direction: column; gap: 10px; }
  .article .meta { display: flex; align-items: center; gap: 8px; color: var(--grey-500); font-size: 12px; font-weight: 500; }
  .article .meta b {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--grey-100);
    color: var(--grey-700); display: inline-grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .article h4 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; color: var(--grey-900); }
  .article p { margin: 0; color: var(--grey-700); font-size: 15px; line-height: 1.6; }
  .article .actions { display: flex; justify-content: flex-end; margin-top: 6px; }
  .btn-ghost {
    position: relative; display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px;
    border-radius: 12px; background: var(--grey-100); color: var(--grey-800);
    font: 600 15px/1 var(--font); text-decoration: none; overflow: hidden;
  }
  .btn-ghost::after { content: ""; position: absolute; inset: 0; background: var(--press); opacity: 0; transition: opacity 120ms var(--ease); }
  .btn-ghost:hover::after, .btn-ghost:active::after { opacity: 1; }
  .btn-ghost svg { width: 16px; height: 16px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

  /* 빈 상태 */
  .empty { text-align: center; padding: 48px 24px; }
  .empty .icon {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 999px; background: var(--grey-100);
    display: grid; place-items: center; color: var(--grey-500);
  }
  .empty h4 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .empty p { margin: 0; color: var(--grey-600); }
  .empty code { font-family: inherit; font-weight: 600; color: var(--grey-800); }

  .foot { padding: 20px 4px 0; text-align: center; }
  .foot a { color: var(--grey-500); font-size: 13px; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .card { padding: 20px; border-radius: 16px; }
    .summary li { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="top-bar"><h1>뉴스 다이제스트</h1></div>
    <div class="chips" id="chips" role="group" aria-label="날짜 선택"></div>
  </div>
  <main id="view" aria-live="polite"></main>
</div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const EMPTY_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/></svg>';

// digest.py가 만드는 마크다운을 구조로 읽는다: 세 줄 요약(번호 목록) + 기사(### 제목 / 문단 / - 원문: 링크)
function parse(md) {
  const out = { three: [], articles: [], empty: false };
  let section = null, cur = null;
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (line === "해당 없음") { out.empty = true; continue; }
    if (line.startsWith("## ")) { section = line.includes("세 줄") ? "three" : "articles"; continue; }
    if (line.startsWith("# ")) continue;
    if (line.startsWith("### ")) { cur = { title: line.slice(4), body: [], link: "" }; out.articles.push(cur); continue; }
    let m;
    if (section === "three" && (m = line.match(/^\d+\.\s+(.*)/))) { out.three.push(m[1]); continue; }
    if (cur && (m = line.match(/^-\s*원문:\s*(\S+)/))) { cur.link = m[1]; continue; }
    if (cur) cur.body.push(line);
  }
  return out;
}

const fmtDate = name => {
  const [y, m, d] = name.replace(/\.md$/, "").split("-").map(Number);
  const day = "일월화수목금토"[new Date(y, m - 1, d).getDay()];
  return `${y}년 ${m}월 ${d}일 ${day}요일`;
};

function emptyCard(title, body) {
  return `<section class="card empty"><div class="icon">${EMPTY_ICON}</div><h4>${title}</h4><p>${body}</p></section>`;
}

function renderDigest(name, md) {
  const d = parse(md);
  const intro = `<div class="intro"><p class="date">${esc(fmtDate(name))}</p>
    <h2>${d.articles.length ? `관심 있는 소식 <em>${d.articles.length}건</em>을 골랐어요` : "오늘은 고른 소식이 없어요"}</h2></div>`;
  if (!d.articles.length) {
    return intro + emptyCard("관심 주제에 맞는 글이 없었어요", "다른 날짜를 골라 보세요.");
  }
  const three = d.three.length ? `<section class="card summary" aria-label="오늘의 세 줄 요약">
      <span class="label">오늘의 세 줄 요약</span>
      <ol>${d.three.map((t, i) => `<li><span class="n">${i + 1}</span><span>${esc(t)}</span></li>`).join("")}</ol>
    </section>` : "";
  const cards = d.articles.map((a, i) => {
    let host = "";
    try { host = new URL(a.link).hostname.replace(/^www\./, ""); } catch {}
    const safe = /^https?:\/\//.test(a.link) ? a.link : "";
    return `<article class="card article">
      <div class="meta"><b>${i + 1}</b>${esc(host)}</div>
      <h4>${esc(a.title)}</h4>
      <p>${esc(a.body.join(" "))}</p>
      ${safe ? `<div class="actions"><a class="btn-ghost" href="${esc(safe)}" target="_blank" rel="noopener noreferrer">원문 보기 ${LINK_ICON}</a></div>` : ""}
    </article>`;
  }).join("");
  return intro + three +
    `<div class="list-header"><h3>기사별 요약</h3><span>${d.articles.length}건</span></div>` + cards +
    `<div class="foot"><a href="digest/${encodeURIComponent(name)}" target="_blank">원본 .md 파일 보기</a></div>`;
}

const chips = document.getElementById("chips");
const view = document.getElementById("view");

async function show(name) {
  for (const c of chips.children) c.setAttribute("aria-pressed", c.dataset.name === name);
  try {
    const res = await fetch(`digest/${encodeURIComponent(name)}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    view.innerHTML = renderDigest(name, await res.text());
    history.replaceState(null, "", `#${name.replace(/\.md$/, "")}`);
  } catch (e) {
    view.innerHTML = emptyCard("파일을 불러오지 못했어요", "서버가 켜져 있는지 확인하고 새로고침해 주세요.");
  }
}

(async () => {
  try {
    // 상대 경로: 로컬 서버(server.py)와 GitHub Pages 하위 경로 모두에서 동작
    const files = await (await fetch("digest/index.json", { cache: "no-store" })).json();
    if (!files.length) {
      view.innerHTML = emptyCard("아직 저장된 다이제스트가 없어요", "<code>python digest.py</code>를 실행하면 여기에 나타나요.");
      return;
    }
    for (const f of files) {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = f.name.replace(/\.md$/, "").slice(5).replace("-", "월 ") + "일";
      b.dataset.name = f.name;
      b.onclick = () => show(f.name);
      chips.appendChild(b);
    }
    const wanted = location.hash.slice(1) + ".md";
    show(files.some(f => f.name === wanted) ? wanted : files[0].name);
  } catch (e) {
    view.innerHTML = emptyCard("서버에 연결하지 못했어요", "<code>python server.py</code>로 서버를 켠 뒤 새로고침해 주세요.");
  }
})();
</script>
</body>
</html>
